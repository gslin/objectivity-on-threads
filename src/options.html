<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <title>Objectivity on Threads - 設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Objectivity on Threads</h1>
      </div>

      <fieldset>
        <legend>網站存取權限</legend>
        <p>
          擴充套件需要存取 Threads 才能顯示分析按鈕，並需要存取 ChatGPT、Claude、Perplexity
          與 Gemini 才能自動填入及送出分析內容。
        </p>
        <p id="site-permission-status" class="hint" role="status">
          正在檢查權限…
        </p>
        <button id="grant-sites" type="button" disabled>授權網站存取</button>
      </fieldset>

      <fieldset id="provider-group">
        <legend>AI 提供者</legend>
        <label class="radio-label">
          <input type="radio" name="provider" value="chatgpt" />
          <span>ChatGPT（暫時對話）</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="provider" value="claude" />
          <span>Claude（無痕模式）</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="provider" value="perplexity" />
          <span>Perplexity（無痕模式）</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="provider" value="gemini" />
          <span>Gemini（暫時對話）</span>
        </label>
      </fieldset>

      <fieldset id="icon-action-group">
        <legend>分析按鈕行為</legend>
        <label class="radio-label">
          <input type="radio" name="iconAction" value="menu" />
          <span>顯示選單選擇 AI</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="iconAction" value="direct" />
          <span>直接開啟預設 AI</span>
        </label>
      </fieldset>

      <div class="actions">
        <button id="save" type="button">儲存</button>
        <button id="reset" type="button" class="secondary">恢復預設</button>
      </div>

      <div id="status" class="status" hidden></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
